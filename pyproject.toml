[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-process-safety-agent"
version = "0.1.0"
description = "Supervisor multi-agent retrieval system and auditable evaluation harness for chemical process safety."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yichen Wang" }]
keywords = [
    "process-safety", "retrieval-augmented-generation", "multi-agent",
    "llm-evaluation", "CSB", "OSHA", "chemical-engineering",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/MaxYichenWang/chemical-process-safety-agent"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "pytest-asyncio>=0.23.0", "black>=23.0.0", "ruff>=0.1.0", "isort>=5.12.0", "httpx>=0.26.0"]

[project.scripts]
cps-eval = "src.evaluation.run:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*"]
namespaces = true

[tool.setuptools.package-data]
"src.web" = ["static/*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests with no external API calls",
    "integration: tests exercising multi-component integration",
    "slow: tests that take longer to execute",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
